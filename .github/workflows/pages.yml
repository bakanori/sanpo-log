# Builds the SANPO LOG site (downloads public map data) and publishes it with GitHub Pages.
# Two jobs (GitHub's own layout): build + check + upload, then deploy in a job of its own.
# Deploying in the same job right after the upload can miss the just-uploaded site (since 2026-11), so they are apart.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build the site
        run: python3 tools/build_site.py
      - name: Set up Python for the checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the site before publishing (if a check fails, nothing is published)
        run: |
          python -m pip install --quiet playwright==1.63.0
          python -m playwright install --with-deps chromium
          python tests/smoke_test.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
